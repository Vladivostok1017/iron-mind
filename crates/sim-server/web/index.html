<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>钢心 · 南浔线 1938</title>
<style>
  :root {
    --bg: #0b0e12; --sea: #0a1119; --panel: #12161c; --panel-hi: #171d25;
    --line: #232a34; --text: #cfd6de; --dim: #79828e;
    --gold: #e3b04b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  #app { display: grid; grid-template-rows: 46px 1fr 52px; height: 100vh; }
  #top {
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #main { display: grid; grid-template-columns: 1fr 316px; overflow: hidden; }
  #stage { position: relative; background: var(--sea); overflow: hidden; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
  /* 战报信箱 */
  #mail { position: fixed; inset: 44px 64px; background: #0d131a; border: 1px solid #2a3542;
    border-radius: 6px; display: none; flex-direction: column; z-index: 60;
    box-shadow: 0 24px 70px rgba(0,0,0,.7); }
  #mail.show { display: flex; }
  #mail .m-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid #1e2833; }
  #mail .m-body { flex: 1; display: flex; min-height: 0; }
  #mail .m-list { width: 340px; overflow-y: auto; border-right: 1px solid #1e2833; }
  #mail .m-item { padding: 9px 13px; font-size: 12px; border-bottom: 1px solid #151b22;
    cursor: pointer; color: #a8b3c0; line-height: 1.55; }
  #mail .m-item:hover { background: #141b23; }
  #mail .m-item.on { background: #1b232d; color: #e6eef7; }
  #mail .m-item .m-meta { color: #6f7a86; font-size: 10.5px; margin-bottom: 2px; }
  #mail .m-detail { flex: 1; overflow-y: auto; padding: 20px 26px; font-size: 14px;
    line-height: 2; color: #d8e2ec; }
  #mail .m-detail .m-title { color: #7c8794; font-size: 11.5px; margin-bottom: 10px; }
  .m-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; border: 1px solid #2a3542;
    color: #8b95a1; cursor: pointer; background: transparent; font-family: inherit; }
  .m-chip.on { background: #1e2733; color: #cfe0f0; border-color: #2f3d4d; }
  #log-latest .lg-kind { color: #7c8794; }
  /* 电报台 */
  #dispatch-sec textarea { width: 100%; box-sizing: border-box; background: #0f151b; color: #cfd8e3;
    border: 1px solid #2a3542; border-radius: 3px; padding: 6px 8px; font-size: 11.5px;
    font-family: inherit; line-height: 1.5; resize: vertical; margin: 5px 0; }
  #dispatch-sec textarea:focus { outline: none; border-color: #3d5a7a; }
  .dp-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8b95a1; }
  .dp-row select { flex: 1; background: #0f151b; color: #cfd8e3; border: 1px solid #2a3542;
    border-radius: 3px; padding: 3px 5px; font-size: 11.5px; }
  #dp-send { width: 100%; margin-bottom: 6px; }
  .tg { font-size: 11px; color: #8b95a1; padding: 4px 0; border-bottom: 1px solid #151b22; line-height: 1.45; }
  .tg .tg-h { display: flex; justify-content: space-between; color: #7c8794; }
  .tg.enroute { color: #a08a5a; }
  /* 公文堆：请示是要人做决定的，视觉上必须比通报重 */
  .dossier { padding: 8px 11px; margin-bottom: 6px; border-radius: 3px; font-size: 11.5px;
    border: 1px solid #2a3542; background: #141b23; line-height: 1.5; cursor: default; }
  .dossier .d-head { display: flex; justify-content: space-between; gap: 8px; color: #9aa6b3; margin-bottom: 3px; }
  .dossier .d-from { color: #cfd8e3; font-weight: 600; }
  .dossier .d-body { color: #b6c0cc; }
  .dossier .d-ask { color: var(--gold); margin-top: 4px; }
  .dossier .d-act { display: flex; gap: 6px; margin-top: 6px; }
  .dossier .d-act button { flex: 1; padding: 4px 0; font-size: 11px; cursor: pointer;
    background: #1d2833; color: #dbe8f5; border: 1px solid #2f3d4d; border-radius: 3px; }
  .dossier .d-act button.yes { border-color: #4d6b45; color: #b6d8a8; }
  .dossier .d-act button.no { border-color: #6b4a45; color: #d8ada8; }
  .dossier.request { border-color: #4a3f22; background: #1b1710; }
  .dossier.dissent { border-color: #4a2f2b; }
  .dossier.done { opacity: .55; }
  /* 部队列表 */
  .ol { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 11.5px;
    color: #a8b3c0; cursor: pointer; border-bottom: 1px solid #151b22; }
  .ol:hover { color: #dbe8f5; background: #141b23; }
  .ol.sel { color: var(--gold); }
  .ol .ol-r { color: #6f7a86; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #log { max-height: 200px; }
  #bottom { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); }

  .crest { width: 26px; height: 26px; border-radius: 3px;
    background: linear-gradient(135deg, #4f8fd4, #2b4d72);
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #dce8f5; }
  .nation { font-size: 14px; font-weight: 600; letter-spacing: .03em; }
  .sub { font-size: 11px; color: var(--dim); }
  .stat { display: flex; flex-direction: column; line-height: 1.25; }
  .stat b { font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat span { font-size: 10px; color: var(--dim); letter-spacing: .06em; }
  .spacer { flex: 1; }
  .clock { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); }
  .pend { padding: 3px 9px; border-radius: 3px; font-size: 11px;
    background: #1d232c; border: 1px solid var(--line); color: var(--dim); }
  .pend.hot { color: var(--gold); border-color: #4a3d24; background: #241e12; }

  svg { display: block; width: 100%; height: 100%; }
  .prov { cursor: pointer; }
  .prov path { transition: filter .1s; }
  .prov:hover path.land { filter: brightness(1.22); }
  .land { stroke: #0d1218; stroke-width: 1.1; stroke-linejoin: round; }
  .water { stroke: #12303f; stroke-width: .8; stroke-linejoin: round; }
  .prov.sel path.land, .prov.sel path.water {
    stroke: var(--gold); stroke-width: 2.2;
  }

  .name {
    font-size: 10.5px; fill: #b6c0cc; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #0a0e13; stroke-width: 2.6px; stroke-linejoin: round;
  }
  .name.enemy { fill: #d2a49c; }
  .name.unknown { fill: #4f5763; }
  .est { font-size: 9.5px; fill: #e8c9a0; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #0a0e13; stroke-width: 2px; }
  .fortmark { font-size: 8px; fill: #b09a63; text-anchor: middle; pointer-events: none; }

  .unit { cursor: pointer; }
  .unit .plate { stroke: #0a0e13; stroke-width: 1.2; }
  .unit.mine .plate { fill: #74abdd; }
  .unit.enemy .plate { fill: #bd5b4e; }
  .unit.sel .plate { stroke: var(--gold); stroke-width: 2.2; }
  .unit .glyph { font-size: 7px; fill: #0a0e13; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .unit .cname { font-size: 8.5px; fill: #bcc7d3; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #0a0e13; stroke-width: 2px; }
  .unit .nname { font-size: 8px; fill: #93a2b3; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #0a0e13; stroke-width: 2px; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: .95 } }

  .sec { border-bottom: 1px solid var(--line); padding: 10px 13px; }
  .sec h3 { font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 600; margin-bottom: 7px; }
  .kv { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  #node-list .nd { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0;
    font-size: 11.5px; color: #a8b3c0; cursor: pointer; border-bottom: 1px solid #151b22; }
  #node-list .nd:hover { color: #dbe8f5; background: #141b23; }
  #node-list .nd.here { color: var(--gold); cursor: default; }
  #node-list .nd .w { color: #6f7a86; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #node-list .nd.here .w { color: #8a7a52; }
  .kv b { font-variant-numeric: tabular-nums; font-weight: 500; }
  #log { flex: 1; overflow-y: auto; padding: 4px 0; }
  #log .item { padding: 5px 13px; font-size: 11.5px; color: #8b95a1; border-bottom: 1px solid #191f26; line-height: 1.45; }
  /* 战报按引擎给的事件类别上色 */
  #log .item.k-combat { color: #c9a07a; }
  #log .item.k-occupy { color: #8fb8d8; }
  #log .item.k-dissent { color: var(--gold); }
  #log .item.k-retreat { color: #a98b7a; }
  #log .item.k-intel { color: #7f9a86; }
  #log .item.k-cmd { color: #cfd8e3; }
  #log .item.k-supply { color: #9aa6b3; }
  #log .item.k-rule { color: #6f7a86; }
  #log .item.hot { color: var(--gold); }
  #log .item.bad { color: #c47a6e; }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 3px; }

  .modes { display: flex; gap: 2px; }
  .mode { padding: 6px 11px; font-size: 11.5px; color: var(--dim); background: transparent;
    border: 1px solid transparent; border-radius: 3px; cursor: pointer; }
  .mode:hover { background: var(--panel-hi); color: var(--text); }
  .mode.on { background: #1e2733; color: #cfe0f0; border-color: #2f3d4d; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  #hint { font-size: 11.5px; color: var(--dim); flex: 1; }
  .btn { padding: 7px 16px; font-size: 12.5px; border-radius: 3px; border: 1px solid #2c3846;
    background: #1b2430; color: #cfdcea; cursor: pointer; font-weight: 500; }
  .btn:hover { background: #223041; }
  .btn.primary { background: linear-gradient(180deg, #2f6394, #265079); border-color: #3d7ab5; color: #eaf3fc; }
  .btn.primary:hover { filter: brightness(1.12); }

  #toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    background: #1c2530; border: 1px solid #33414f; border-radius: 4px; padding: 7px 15px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 10; }
  #toast.show { opacity: 1; }
  #tip { position: absolute; pointer-events: none; z-index: 9; background: #161d26;
    border: 1px solid #2d3947; border-radius: 4px; padding: 8px 11px; font-size: 11.5px;
    line-height: 1.6; max-width: 220px; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.55); }
  #tip .t-name { font-weight: 600; color: #dfe7ef; margin-bottom: 3px; }
  #tip .t-row { color: #8b95a1; }
  #tip .t-row b { color: #c3ccd6; font-weight: 500; }
  /* 行军线：虚线 + 剩余天数 */
  .marchline text { fill: #c9a227; font-size: 9px; font-weight: 600;
    text-anchor: middle; paint-order: stroke; stroke: #0b1016; stroke-width: 2.4px; }
  /* 地形视图的高程色标 */
  #hypso-leg { position: absolute; left: 14px; bottom: 14px; width: 190px; display: none;
    background: rgba(16,22,29,.86); border: 1px solid #2d3947; border-radius: 4px;
    padding: 6px 8px 4px; font-size: 10px; color: #8b95a1; z-index: 8; pointer-events: none; }
  #hypso-leg.on { display: block; }
  #hypso-leg .hl-bar { height: 8px; border-radius: 2px; }
  #hypso-leg .hl-ticks { display: flex; justify-content: space-between; margin-top: 3px; }
  #outcome { position: fixed; inset: 0; background: rgba(8,12,16,.82); z-index: 40;
    display: none; align-items: center; justify-content: center; }
  #outcome.on { display: flex; }
  #outcome .box { width: 560px; max-height: 78vh; overflow: auto; background: #12181f;
    border: 1px solid #33414f; border-radius: 6px; padding: 22px 26px;
    box-shadow: 0 18px 50px rgba(0,0,0,.7); }
  #outcome .oid { font-size: 11px; color: #7c8794; letter-spacing: 2px; }
  #outcome h2 { font-size: 22px; color: #e6edf5; margin: 6px 0 12px; font-weight: 600; }
  #outcome p { font-size: 13px; color: #b9c4d0; line-height: 1.9; margin: 0 0 16px; }
  #outcome .mrow { display: flex; justify-content: space-between; font-size: 12px;
    color: #8b95a1; padding: 3px 0; border-bottom: 1px dashed #232d38; }
  #outcome .mrow b { color: #cdd6e0; font-weight: 500; }
  #outcome .foot { margin-top: 18px; font-size: 11.5px; color: #6f7a86; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="crest">中</div>
    <div>
      <div class="nation">中华民国 · 第九战区</div>
      <div class="sub">南浔线 · 第 1 兵团</div>
    </div>
    <div class="stat"><b id="s-str">—</b><span>我军兵力</span></div>
    <div class="stat"><b id="s-prov">—</b><span>控制省份</span></div>
    <div class="stat"><b id="s-enemy">—</b><span>敌军估计</span></div>
    <div class="spacer"></div>
    <div class="pend" id="pending">战报 —</div>
    <div class="clock" id="clock">第 0 日</div>
  </div>

  <div id="main">
    <div id="stage">
      <svg id="map"></svg>
      <div id="toast"></div>
      <div id="tip"></div>
      <!-- 地形视图 = 真实高程图，所以要有一条色标，否则颜色只是一团好看的绿。
           数字就是判地形的输入（tools/mapgen/terrain.js 从 DEM 采样）。 -->
      <div id="hypso-leg">
        <div class="hl-bar" id="hl-bar"></div>
        <div class="hl-ticks"><span>0</span><span>200</span><span>500</span><span>900</span><span>1300 米</span></div>
      </div>
    </div>
    <aside>
      <!-- 电报台：玩家唯一的指挥手段。地图只用来查看。 -->
      <div class="sec" id="dispatch-sec">
        <h3>电报台</h3>
        <div class="dp-row"><span>发给</span><select id="dp-to"></select></div>
        <textarea id="dp-text" rows="3" placeholder="用一句话下命令，例如：守住德安至万家岭一线，工事加厚，不许拿部队去拼消耗。"></textarea>
        <button class="btn primary" id="dp-send">发出电报</button>
        <div id="dp-list"></div>
      </div>
      <!-- 公文堆：请示（要你批）/ 抗命 / 通报。参照 HOI4，右侧是"军情与部队"，不是流水账。 -->
      <div class="sec" id="dossier-sec">
        <h3>公文堆 <span id="dossier-count" style="color:#7c8794;font-weight:400"></span></h3>
        <div id="dossiers"></div>
      </div>
      <!-- 部队列表（HOI4 的 outliner）：不用在图上找单位，直接从列表选 -->
      <div class="sec">
        <h3>部队 <span id="outliner-count" style="color:#7c8794;font-weight:400"></span></h3>
        <div id="outliner"></div>
      </div>
      <div class="sec" id="node-sec" style="display:none">
        <h3>阵地 <span id="node-prov" style="color:#7c8794;font-weight:400"></span></h3>
        <div id="node-list"></div>
      </div>
      <div class="sec">
        <h3>态势</h3>
        <div class="kv"><span>通信手段</span><b id="k-comms">—</b></div>
        <div class="kv"><span>报告延迟</span><b id="k-delay">—</b></div>
        <div class="kv"><span>将领大脑</span><b id="k-llm">—</b></div>
        <div class="kv"><span>已知敌情</span><b id="k-known">—</b></div>
        <div class="kv"><span>在途战报</span><b id="k-pend">—</b></div>
      </div>
      <div class="sec" style="border-bottom:none;padding-bottom:6px">
        <h3>战报</h3>
        <div id="log-latest" style="font-size:12px;color:#a8b3c0;line-height:1.6;margin-bottom:8px"></div>
        <button class="btn" id="open-mail" style="width:100%">打开战报信箱</button>
      </div>
    </aside>
  </div>

  <!-- 战报信箱：一封一封看，而不是挤在一个小窗口里 -->
  <div id="mail">
    <div class="m-head">
      <b style="font-size:13px">战报信箱</b>
      <span id="mail-count" style="color:#7c8794;font-size:11.5px"></span>
      <div id="mail-chips" style="display:flex;gap:6px;margin-left:auto"></div>
      <button class="btn" id="mail-close">关闭</button>
    </div>
    <div class="m-body">
      <div class="m-list" id="mail-list"></div>
      <div class="m-detail" id="mail-detail">左侧选一条战报</div>
    </div>
  </div>

  <div id="bottom">
    <div class="modes" id="modes">
      <button class="mode on" data-view="owner">归属</button>
      <button class="mode" data-view="intel">情报</button>
      <button class="mode" data-view="supply">补给</button>
      <button class="mode" data-view="terrain">地形</button>
    </div>
    <div class="sep"></div>
    <!-- 模块 = 这一仗的剧本。游戏只提供框架，剧本由玩家自己写，所以必须能在这儿换。 -->
    <select id="mod-sel" title="切换模块（会重开一局）" style="font-size:11.5px;background:#141b23;color:#c3ccd6;border:1px solid #2d3947;border-radius:4px;padding:5px 6px;max-width:190px"></select>
    <div id="hint">地图只作查看：点单位看详情；下命令请用右侧电报台</div>
    <button class="btn" id="btn-save">存档</button>
    <button class="btn" id="btn-load">读档</button>
    <button class="btn" id="btn-reset">重开</button>
    <button class="btn" id="btn-3">推进 3 日</button>
    <!-- 玩家真正想要的是"跳过没事的日子"，不是"再推一天" -->
    <button class="btn" id="btn-next">推进到有事 ⏎</button>
    <button class="btn primary" id="btn-1">推进 1 日 ␣</button>
  </div>
  <!-- 结局面板：战役结束后盖住全局。没有"你赢了"三个字，只有一条结局与它的依据。 -->
  <div id="outcome">
    <div class="box">
      <div class="oid" id="oc-id"></div>
      <h2 id="oc-name"></h2>
      <p id="oc-text"></p>
      <div id="oc-metrics"></div>
      <div class="foot">这一局结束了。刷新页面可以重开。</div>
    </div>
  </div>
</div>

<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const W = 1000, H = 720, PAD = 26;

// ---- 相机 ----
// 87 个省挤在一屏里必然看不清，必须能缩放平移。
// SVG 用 viewBox 当相机：平移缩放改 viewBox，原生命中测试跟着走，不用自己写拾取。
// （等省+阵地超过约 800 个多边形，再考虑换 Canvas，见 docs/11）
let cam = { x: 0, y: 0, z: 1 };
const CAM_MAX = 6;

function camView() {
  const w = W / cam.z, h = H / cam.z;
  return { x: cam.x, y: cam.y, w, h };
}

function applyCam() {
  const v = camView();
  const svg = document.getElementById("map");
  if (svg) svg.setAttribute("viewBox", v.x + " " + v.y + " " + v.w + " " + v.h);
}

// 把相机限制在地图范围内，别让玩家把地图拖出屏幕外
function clampCam() {
  const v = camView();
  const minX = -v.w * 0.05, maxX = W - v.w * 0.95;
  const minY = -v.h * 0.05, maxY = H - v.h * 0.95;
  cam.x = Math.min(maxX, Math.max(minX, cam.x));
  cam.y = Math.min(maxY, Math.max(minY, cam.y));
}

let S = null;
let selUnit = null;
let view = "owner";
let curProv = null;
// 右键查看的省份。null 表示跟随选中单位所在省。
let nodeProv = null;
let lastEv = null;
let geom = null;         // { cells: {id: [[x,y],...]}, centroids: {id:[x,y]}, box }
const $ = (id) => document.getElementById(id);
const TERRAIN_CN = { plain: "平原", hill: "丘陵", mountain: "山地", marsh: "沼泽", water: "水域", urban: "城镇" };

/* 顶层 units 不存在于后端快照里，单位是嵌在各省下面的。
   之前直接写 S.units.find() 会抛异常，导致选中单位后地图渲染中断、
   整张地图空白——这就是"点兵之后地点全没了"的 bug。 */
function allUnits() {
  const out = [];
  for (const p of S.provinces) {
    for (const u of (p.units || [])) out.push(u);
  }
  return out;
}

/* ---------- 投影：经纬度 → 画布 ---------- */
function project() {
  const lons = S.provinces.map((p) => p.lon);
  const lats = S.provinces.map((p) => p.lat);
  const lonMin = Math.min.apply(null, lons), lonMax = Math.max.apply(null, lons);
  const latMin = Math.min.apply(null, lats), latMax = Math.max.apply(null, lats);

  // 经度按中纬度余弦修正，避免东西向过度拉伸
  const midLat = (latMin + latMax) / 2;
  const cosLat = Math.cos(midLat * Math.PI / 180);
  const wDeg = Math.max((lonMax - lonMin) * cosLat, 1e-4);
  const hDeg = Math.max(latMax - latMin, 1e-4);

  const availW = W - PAD * 2, availH = H - PAD * 2;
  const scale = Math.min(availW / wDeg, availH / hDeg);
  const mapW = wDeg * scale, mapH = hDeg * scale;
  const ox = (W - mapW) / 2, oy = (H - mapH) / 2;

  return {
    pt(lon, lat) {
      return [ox + (lon - lonMin) * cosLat * scale, oy + (latMax - lat) * scale];
    },
    box: [ox, oy, ox + mapW, oy + mapH],
  };
}

/* ---------- 模块自带的真实省界 ---------- */
/* 模块可以给一个 provinces_geo.json（用真实县界做的省轮廓）。
   有就用真形状；没有就退回 Voronoi——两种尺度的模块都能活。 */
let GEO = null;

async function loadGeo() {
  try {
    const r = await fetch("/provinces_geo.json");
    if (!r.ok) return;         // 这个模块没有真省界，正常
    const j = await r.json();
    GEO = j.polygons || null;
    geom = null;               // 重新算几何
    render();
  } catch (e) { console.warn("省界加载失败", e); }
}
/* ---------- 真实地理底图 ---------- */
/* 省份是 Voronoi 切的，形状天然抽象；底下垫一层真实水系（长江、赣江、鄱阳湖），
   地图立刻就能读懂了。数据来自 Natural Earth 1:50m（公有领域），见 tools/mapgen/basemap.js */
let BASEMAP = null;

async function loadBasemap() {
  try {
    const j = await (await fetch("/basemap.json")).json();
    BASEMAP = j;
    if (geom) render();
  } catch (e) { console.warn("底图加载失败", e); }
}

function drawBasemap(svg) {
  if (!BASEMAP || !geom || !geom.proj) return;
  const proj = geom.proj;
  const g = el("g", { class: "basemap", opacity: ".9" }, svg);

  const toPath = (line, close) => {
    let d = "";
    for (let i = 0; i < line.length; i++) {
      const [x, y] = proj.pt(line[i][0], line[i][1]);
      d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    }
    return close ? d + "Z" : d;
  };

  const lakes = (BASEMAP.layers && BASEMAP.layers.lakes) || [];
  for (const ring of lakes) {
    el("path", {
      // 湖泊只做淡淡的底+清楚的边：填太实会和"水域省份"混淆
      d: toPath(ring, true), fill: "#1b3b4d", "fill-opacity": ".3",
      stroke: "#2f6480", "stroke-width": 1,
    }, g);
  }
  const rivers = (BASEMAP.layers && BASEMAP.layers.rivers) || [];
  for (const line of rivers) {
    el("path", {
      d: toPath(line, false), fill: "none", stroke: "#3d7fa3",
      "stroke-width": 1.1, "stroke-opacity": ".85", "stroke-linecap": "round",
    }, g);
  }
  const coast = (BASEMAP.layers && BASEMAP.layers.coast) || [];
  for (const line of coast) {
    el("path", {
      d: toPath(line, false), fill: "none", stroke: "#4a6a80",
      "stroke-width": 1.4, "stroke-opacity": ".9",
    }, g);
  }
}
/* ---------- Voronoi：半平面裁剪 ---------- */
/* 每个省从整个地图矩形开始，依次用它与其他省的中垂线切割，
   只保留靠近自己的一侧。切完就是这个省的多边形。
   这样边界天然贴合，不会留缝——比画圆好得多。 */
function clipHalf(poly, a, b) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const nx = b[0] - a[0], ny = b[1] - a[1];
  const out = [];
  const n = poly.length;
  for (let i = 0; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n];
    const dp = (p[0] - mx) * nx + (p[1] - my) * ny;
    const dq = (q[0] - mx) * nx + (q[1] - my) * ny;
    if (dp <= 0) out.push(p);
    if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
      const t = dp / (dp - dq);
      out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
    }
  }
  return out;
}

function buildGeom() {
  const proj = project();
  const box = proj.box;
  const pts = {};
  for (const p of S.provinces) pts[p.id] = proj.pt(p.lon, p.lat);

  const cells = {};
  const centroids = {};
  const ids = Object.keys(pts);

  // 真省界优先：直接用模块给的多边形（经投影），不切 Voronoi
  const centroid = (poly) => {
    let cx = 0, cy = 0, area = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const cross = p[0] * q[1] - q[0] * p[1];
      area += cross;
      cx += (p[0] + q[0]) * cross;
      cy += (p[1] + q[1]) * cross;
    }
    area *= 0.5;
    if (Math.abs(area) < 1e-6) return [poly[0][0], poly[0][1]];
    return [cx / (6 * area), cy / (6 * area)];
  };

  if (GEO) {
    for (const p of S.provinces) {
      const rings = GEO[p.id];
      if (!rings || !rings[0] || rings[0].length < 3) continue;
      const poly = rings[0].map(([lon, lat]) => proj.pt(lon, lat));
      cells[p.id] = poly;
      centroids[p.id] = centroid(poly);
    }
    // 水系省份没有面（它按"水道带"画），但质心必须有，否则河带和标签会消失
    for (const p of S.provinces) {
      if (!centroids[p.id]) centroids[p.id] = proj.pt(p.lon, p.lat);
    }
    geom = { cells, centroids, box, proj };
    return;
  }

  for (const id of ids) {
    let poly = [[box[0], box[1]], [box[2], box[1]], [box[2], box[3]], [box[0], box[3]]];
    const a = pts[id];
    for (const other of ids) {
      if (other === id) continue;
      poly = clipHalf(poly, a, pts[other]);
      if (poly.length < 3) break;
    }
    cells[id] = poly;
    // 质心用面积加权，比顶点平均稳
    let cx = 0, cy = 0, area = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const cross = p[0] * q[1] - q[0] * p[1];
      area += cross;
      cx += (p[0] + q[0]) * cross;
      cy += (p[1] + q[1]) * cross;
    }
    area *= 0.5;
    if (Math.abs(area) < 1e-6) {
      centroids[id] = [a[0], a[1]];
    } else {
      centroids[id] = [cx / (6 * area), cy / (6 * area)];
    }
  }
  geom = { cells, centroids, box, proj };
}

function ptsToPath(poly) {
  if (!poly || poly.length < 3) return "";
  let d = "M" + poly[0][0].toFixed(1) + "," + poly[0][1].toFixed(1);
  for (let i = 1; i < poly.length; i++) d += "L" + poly[i][0].toFixed(1) + "," + poly[i][1].toFixed(1);
  return d + "Z";
}

/* ---------- 着色 ---------- */
/* 地形视图 = 真实高程图。
   色带从低地暗绿到山地灰白，输入是 map.json 的 `elev`（米），
   而 `elev` 和 `terrain` 出自同一份 DEM 采样（tools/mapgen/terrain.js）。
   所以"这里为什么是山地"在图上自己就回答了一半。 */
const HYPSO = [
  [0, [47, 74, 56]],
  [150, [74, 82, 48]],
  [400, [107, 91, 57]],
  [800, [139, 125, 102]],
  [1300, [185, 178, 166]],
];
function hypso(elev) {
  let i = 1;
  while (i < HYPSO.length && elev > HYPSO[i][0]) i++;
  const [h1, c1] = HYPSO[Math.min(i, HYPSO.length - 1)];
  const [h0, c0] = HYPSO[Math.max(0, Math.min(i, HYPSO.length - 1) - 1)];
  const k = h1 === h0 ? 0 : Math.max(0, Math.min(1, (elev - h0) / (h1 - h0)));
  const rgb = c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
  return "rgb(" + rgb.join(",") + ")";
}

/* 色标条：只在"地形"视图显示。渐变必须和 hypso() 同源，所以直接从头到尾渲染一遍。 */
function paintHypsLegend() {
  const leg = document.getElementById("hypso-leg");
  const bar = document.getElementById("hl-bar");
  if (!leg || !bar) return;
  leg.classList.toggle("on", view === "terrain");
  if (!bar.dataset.filled) {
    const stops = [];
    for (let e = 0; e <= 1300; e += 20) stops.push(hypso(e) + " " + ((e / 1300) * 100).toFixed(1) + "%");
    bar.style.background = "linear-gradient(90deg," + stops.join(",") + ")";
    bar.dataset.filled = "1";
  }
}

function landFill(p) {
  if (view === "terrain") {
    if (p.terrain === "water") return "#16303f";
    if (p.terrain === "urban") return "#4d4250";
    if (p.terrain === "marsh") return "#2f4747";
    if (p.elev != null) return hypso(p.elev);
    return { plain: "#3f4d3c", hill: "#4d4638", mountain: "#4a4038" }[p.terrain] || "#3a3a3a";
  }
  if (view === "intel") {
    if (p.mine) return "#274866";
    if (!p.intel.known) return "#171c22";
    return { "精确": "#8a4038", "近似": "#63372f", "传闻": "#3d2b26" }[p.intel.accuracy] || "#241f1e";
  }
  if (view === "supply") {
    if (p.terrain === "water") return "#14262f";
    const u = (p.units || []).find((x) => x.mine);
    if (!u) return p.mine ? "#1c2731" : "#241c1b";
    const s = u.supply;
    return "rgb(" + Math.round(28 + s * 22) + "," + Math.round(42 + s * 92) + "," + Math.round(52 + s * 40) + ")";
  }
  if (!p.owner_known) return "#242a32";
  if (p.terrain === "water") return "#14262f";
  return p.mine ? "#2c5178" : "#753530";
}

function waterFill(p) {
  if (view === "intel" && !p.owner_known) return "#101820";
  return "#14262f";
}

/* ---------- 渲染 ---------- */
// 侧栏「阵地」面板：选中单位后列出它所在省的每个阵地。
// 这是回答"这个山头守的是谁、宽度够不够展开"的地方，
// 也是调兵的主要入口——点一行就把部队挪过去，不耗天数。
function renderNodes() {
  const sec = $("node-sec"), list = $("node-list");
  const u = selUnit !== null ? allUnits().find((x) => x.index === selUnit) : null;
  const uProv = u ? S.provinces.find((q) => (q.units || []).some((x) => x.index === u.index)) : null;
  // 右键看的是"这个省"，选中单位看的是"我的部队所在省"。右键优先。
  const pid = nodeProv !== null ? nodeProv : (uProv ? uProv.id : null);
  if (pid === null) { sec.style.display = "none"; return; }
  const p = S.provinces.find((q) => q.id === pid);
  if (!p || !p.positions || !p.positions.length) { sec.style.display = "none"; return; }

  const here = uProv && uProv.id === p.id ? u.node : -1;

  sec.style.display = "";
  $("node-prov").textContent =
    p.positions.length > 1 ? p.name + "（" + p.positions.length + " 个阵地）" : p.name + "（未拆阵地）";
  list.innerHTML = "";
  p.positions.forEach((nd, i) => {
    const isHere = i === here;
    const d = document.createElement("div");
    d.className = "nd" + (isHere ? " here" : "");
    const left = document.createElement("span");
    left.textContent = (isHere ? "▸ " : "") + nd.name + (nd.fort ? "　砦" + nd.fort : "");
    const right = document.createElement("span");
    right.className = "w";
    right.textContent = "宽 " + Math.round(nd.width * 100) + "%" + (isHere || here < 0 ? "" : " →");
    d.appendChild(left);
    d.appendChild(right);
    if (here >= 0 && !isHere) {
      d.title = "调到" + nd.name + "（不耗天数）";
      d.addEventListener("click", (ev) => {
        ev.stopPropagation();
        api("/api/order", { unit: selUnit, kind: "shift", target: i });
        toast("调兵 → " + nd.name);
      });
    } else if (here < 0) {
      d.title = "选中一支在本省的部队后，点这一行可以把部队调过来";
    }
    list.appendChild(d);
  });
  // 单阵地省：标题已经写明"未拆阵地"，不再多发一行
}

function render() {
  if (!S) return;
  paintHypsLegend();
  // 每个面板单独 try：一块面板的 bug 不该让整张地图变白。
  // （之前是整块 try，一个未定义变量就把地图和右栏一起搞没了。
  //   分块之后，出错的那一块自己在控制台报，其余照常显示。）
  const parts = [["top", renderTop], ["map", renderMap], ["nodes", renderNodes], ["outliner", renderOutliner], ["dispatch", renderDispatch], ["latest", renderLatestLog]];
  try { if (!geom) buildGeom(); } catch (e) { console.error("buildGeom", e); }
  for (const [name, fn] of parts) {
    try {
      fn();
    } catch (e) {
      console.error("render:" + name, e);
      toast("界面「" + name + "」渲染出错：" + e.message);
    }
  }
}

function renderTop() {
  $("s-str").textContent = S.side.strength.toFixed(1) + " 千";
  $("s-prov").textContent = S.side.provinces + " / " + S.provinces.length;
  $("s-enemy").textContent = S.enemy.estimated_strength.toFixed(1) + " 千";
  $("clock").textContent = "第 " + S.tick + " 日";
  const pend = S.side.pending_reports;
  const pe = $("pending");
  pe.textContent = pend > 0 ? "战报 " + pend + " 份在途" : "战报已清";
  pe.className = "pend" + (pend > 0 ? " hot" : "");
  $("k-comms").textContent = S.comms.kind;
  $("k-delay").textContent = S.comms.report_delay + " 日";
  $("k-known").textContent = (S.enemy.known_provinces || 0) + " 处";
  $("k-pend").textContent = pend + " 份";
}

function renderMap() {
  const svg = $("map");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  applyCam();
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  const sel = selUnit !== null ? allUnits().find((u) => u.index === selUnit) : null;

  const reach = new Set();
  if (sel) {
    const cp = S.provinces.find((p) => p.id === curProv);
    if (cp) for (const nb of cp.neighbors) reach.add(nb);
  }

  // ---- 作战地图纸 ----
  // 战区是南北长条，画布是宽的，两侧必然留白。
  // 与其空着，不如做成"摊开的地图"：纸面略亮、有经纬网、纸外更暗。
  const bx = geom.box[0], by = geom.box[1];
  const bw = geom.box[2] - bx, bh = geom.box[3] - by;

  el("rect", {
    x: bx - 10, y: by - 10, width: bw + 20, height: bh + 20,
    fill: "#080b0f",
  }, svg);

  // 纸面（底）用水的颜色：真实省界之间会留出河湖的空隙，
  // 底色是水，这些空隙自然就读成"水面"，而不是"地图缺了一块"
  el("rect", {
    x: bx, y: by, width: bw, height: bh,
    fill: "#0a151d", stroke: "#1e2833", "stroke-width": 1,
  }, svg);

  // 经纬网（每 0.2 度一格，纯装饰，帮人判断方位与距离）
  const grid = el("g", { opacity: ".5" }, svg);
  const steps = 6;
  for (let i = 1; i < steps; i++) {
    const y = by + (bh / steps) * i;
    el("line", { x1: bx, y1: y, x2: bx + bw, y2: y, stroke: "#161f28", "stroke-width": 1 }, grid);
  }
  for (let i = 1; i < 4; i++) {
    const x = bx + (bw / 4) * i;
    el("line", { x1: x, y1: by, x2: x, y2: by + bh, stroke: "#161f28", "stroke-width": 1 }, grid);
  }

  // 纬向标注（北/南）
  const nb = el("text", {
    x: bx + bw / 2, y: by - 2, "text-anchor": "middle",
    "font-size": "9", fill: "#3f4a57", "letter-spacing": ".2em",
  }, svg);
  nb.textContent = "北";
  const sb = el("text", {
    x: bx + bw / 2, y: by + bh + 11, "text-anchor": "middle",
    "font-size": "9", fill: "#3f4a57", "letter-spacing": ".2em",
  }, svg);
  sb.textContent = "南";

  // 省份多边形
  for (const p of S.provinces) {
    const poly = geom.cells[p.id];
    if (!poly || poly.length < 3) continue;

    // 水域只铺一层很暗的底色（湖面、江面），省界和敌情都不画，
    // 之后再叠一条水道带（见下方「水道」一段）。
    // 不铺底色的话，水域会露出纸面，看起来像地图破了洞。
    if (p.terrain === "water") {
      el("path", { d: ptsToPath(poly), fill: "#0e1a22", class: "water" }, svg);
      continue;
    }

    const g = el("g", { class: "prov" + (selUnit !== null && curProv === p.id ? " sel" : ""), "data-prov": p.id }, svg);

    el("path", {
      d: ptsToPath(poly),
      fill: landFill(p),
      class: "land",
    }, g);

    // 敌情精度：外描边
    if (!p.mine && p.intel.known) {
      const acc = p.intel.accuracy_code;
      el("path", {
        d: ptsToPath(poly), fill: "none",
        stroke: acc === 3 ? "#d9a15e" : (acc === 2 ? "#8f6a34" : "#5a4a2e"),
        "stroke-width": acc === 3 ? 1.6 : 1,
        "stroke-dasharray": acc === 3 ? "none" : (acc === 2 ? "5 3" : "2 4"),
        opacity: ".85",
      }, g);
    }



    g.addEventListener("click", (ev) => { ev.stopPropagation(); onProvince(p); });
    // 右键 = 查看这个省的阵地（不需要先选部队）
    g.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      nodeProv = p.id;
      hideTip();
      render();
      const n = (p.positions || []).length;
      toast(p.name + "：" + (n > 1 ? n + " 个阵地，见右侧" : "未拆阵地"));
    });
    g.addEventListener("mouseenter", (ev) => showTip(ev, p));
    g.addEventListener("mousemove", (ev) => moveTip(ev));
    g.addEventListener("mouseleave", hideTip);
  }

  // ---- 水道 ----
  // 同一条水系（名字里 "·" 之前的部分）按 id 顺序连成折线，画成一条带。
  // id 顺序就是作者写清单的顺序，也就是上游到下游，所以连出来就是河道走向。
  {
    const groups = new Map();
    for (const p of S.provinces) {
      if (p.terrain !== "water") continue;
      const key = p.name.indexOf("·") >= 0 ? p.name.split("·")[0] : "水";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    const wg = el("g", {}, svg);
    for (const list of groups.values()) {
      list.sort((a, b) => a.id - b.id);
      const cs = list.map((p) => geom.centroids[p.id]).filter(Boolean);
      if (cs.length < 2) continue;
      const d = cs
        .map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1))
        .join(" ");
      el("path", {
        d, fill: "none", stroke: "#0b1822", "stroke-width": 16,
        "stroke-linecap": "round", "stroke-linejoin": "round",
      }, wg);
      el("path", {
        d, fill: "none", stroke: "#1d4152", "stroke-width": 11,
        "stroke-linecap": "round", "stroke-linejoin": "round",
      }, wg);
    }
    // 每个水域省留一个透明小圆作点击目标，否则舰队没法下令
    for (const p of S.provinces) {
      if (p.terrain !== "water") continue;
      const c = geom.centroids[p.id];
      if (!c) continue;
      const hit = el("circle", {
        cx: c[0], cy: c[1], r: 11, fill: "transparent",
        style: "cursor:pointer",
      }, wg);
      hit.addEventListener("click", (ev) => { ev.stopPropagation(); onProvince(p); });
      hit.addEventListener("mouseenter", (ev) => showTip(ev, p));
      hit.addEventListener("mousemove", (ev) => moveTip(ev));
      hit.addEventListener("mouseleave", hideTip);
    }
  }

  // 真实水系压在最上面：省色是"归属"，河湖是"地理"，两层叠起来才像地图
  drawBasemap(svg);

  // 名称与标记（画在多边形之上，避免被覆盖）
  for (const p of S.provinces) {
    const c = geom.centroids[p.id];
    if (!c) continue;
    const g = el("g", {}, svg);
    const isWater = p.terrain === "water";

    // ---- 标签密度 ----
    // 90 个省摊在一张图上，每个都写名字必然糊成一片。
    // 只给"格子装得下"的省写名字，装不下的靠悬停提示和选中态显示。
    // 省名是低价值信息，边界和归属才是要读的。
    const poly = geom.cells[p.id];
    let minx = 1e9, maxx = -1e9;
    if (poly) {
      for (const pt of poly) {
        if (pt[0] < minx) minx = pt[0];
        if (pt[0] > maxx) maxx = pt[0];
      }
    }
    // 水道名很长（长江·田家镇），显示时只留后半截
    const label = p.name.indexOf("·") >= 0 ? p.name.split("·")[1] : p.name;
    const fits = maxx - minx >= label.length * 13;

    if (fits) {
      const cls = "name" + (p.mine ? "" : (p.owner_known ? " enemy" : " unknown"));
      const nm = el("text", { x: c[0], y: c[1] + (isWater ? 18 : 4), class: cls }, g);
      nm.textContent = label;
    }

    if (fits && !p.mine && p.intel.known && p.intel.strength > 0) {
      const es = el("text", { x: c[0], y: c[1] + 16, class: "est" }, g);
      es.textContent = "≈" + p.intel.strength.toFixed(0);
    }

    if (fits && p.fort > 0) {
      const f = el("text", { x: c[0] + 26, y: c[1] - 10, class: "fortmark" }, g);
      f.textContent = "砦" + p.fort;
    }

    // 单位
    const units = p.units || [];
    units.forEach((u, k) => {
      const ux = c[0] + (k - (units.length - 1) / 2) * 15;
      const uy = c[1] - 16;
      const ug = el("g", { class: "unit " + (u.mine ? "mine" : "enemy") + (selUnit === u.index ? " sel" : "") }, g);
      el("rect", { x: ux - 7, y: uy - 7, width: 14, height: 14, rx: 2, class: "plate" }, ug);
      const gl = el("text", { x: ux, y: uy + 2.6, class: "glyph" }, ug);
      gl.textContent = u.kind_code === 2 ? "机" : (u.kind_code === 3 ? "舰" : "兵");
      const cn = el("text", { x: ux, y: uy + 17, class: "cname" }, ug);
      cn.textContent = u.commander.slice(0, 3);
      // 多阵地省：只给**选中**的单位显示阵地名。
      // 全显示的话，一个省三四个单位就糊成一团，反而看不清地图。
      if (p.positions && p.positions.length > 1 && p.positions[u.node] && selUnit === u.index) {
        const nd = el("text", { x: ux, y: uy + 26, class: "nname" }, ug);
        nd.textContent = p.positions[u.node].name;
      }
      ug.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!u.mine) return;
        selUnit = u.index;
        curProv = p.id;
        nodeProv = null; // 侧栏跟回"我的部队所在省"
        $("hint").textContent = "已选 " + u.name + "·" + u.commander + "（" +
          u.strength.toFixed(1) + " 千）——指挥请发电报；右键任意省看阵地";
        render();
      });
    });
  }

  svg.addEventListener("click", () => {
    if (selUnit !== null) {
      selUnit = null; curProv = null;
      $("hint").textContent = "地图只作查看：点单位看详情；下命令请用右侧电报台";
      render();
    }
  });

  // 行军线：一条虚线 + "3日"。
  //
  // 没有它，远距离调动在地图上完全看不见——部队"消失几天"，然后在别处出现。
  // 玩家只能从侧栏的数字猜。线画在最后、且 pointer-events:none，
  // 所以它不会挡点击，也不会盖住单位方块的可读性。
  const marchG = el("g", { class: "marchline", "pointer-events": "none" }, svg);
  for (const p of S.provinces) {
    for (const u of p.units || []) {
      if (!u.mine || !(u.march_hops > 0) || u.march_target === null || u.march_target === undefined) continue;
      const a = geom.centroids[p.id];
      const b = geom.centroids[u.march_target];
      if (!a || !b) continue;
      el("line", {
        x1: a[0], y1: a[1], x2: b[0], y2: b[1],
        stroke: "#c9a227", "stroke-width": 1.3, "stroke-dasharray": "5 4", opacity: 0.75,
      }, marchG);
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 - 4;
      const t = el("text", { x: mx, y: my, class: "marchlab" }, marchG);
      t.textContent = u.march_hops + "日";
    }
  }
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function toast(m) {
  const t = $("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1700);
}

// 绑定助手：元素不存在就跳过。
// 为什么需要：删掉一个按钮的 HTML，却漏掉它的 addEventListener，
// $("x") 返回 null → TypeError → **后面整段脚本都不执行**（boot 都不会跑），
// 表现就是"地图没了"。用 bind 之后，少一个元素最多少一个功能。
function bind(id, evName, fn) {
  const el = document.getElementById(id);
  if (!el) { console.warn("缺少元素 #" + id + "，跳过绑定"); return; }
  el.addEventListener(evName, fn);
}
// 结局面板。只要有 outcome 就盖上来——战役结束了，不许再推进。
// 刻意不写"胜利/失败"：一场战役的结束是一个**局面**，不是一个字。
function showOutcome() {
  const box = $("outcome");
  if (!box || !S || !S.outcome) return;
  const o = S.outcome;
  $("oc-id").textContent = "结局 " + o.id + " · 第 " + o.day + " 日";
  $("oc-name").textContent = o.name;
  $("oc-text").textContent = o.text || "";
  const m = $("oc-metrics");
  m.innerHTML = "";
  for (const row of o.metrics || []) {
    const d = document.createElement("div");
    d.className = "mrow";
    const k = document.createElement("span");
    k.textContent = row.label;
    const v = document.createElement("b");
    v.textContent = row.value;
    d.appendChild(k);
    d.appendChild(v);
    m.appendChild(d);
  }
  box.classList.add("on");
}

// 模块选择器：列出 content/scenarios/*.imod，切换 = 重开一局。
// 切完要重新拉省界（每个模块的 provinces_geo.json 不一样），
// 否则地图还是上一局的多边形。
async function loadModules() {
  const sel = $("mod-sel");
  if (!sel) return;
  try {
    const j = await (await fetch("/api/modules")).json();
    sel.innerHTML = "";
    for (const m of j.modules || []) {
      const o = document.createElement("option");
      o.value = m.path;
      o.textContent = m.name + (m.scale ? "（" + m.scale + "）" : "");
      if (m.current) o.selected = true;
      sel.appendChild(o);
    }
  } catch (e) { /* 服务还没起来，boot 会重试 */ }
}

bind("mod-sel", "change", async () => {
  const path = $("mod-sel").value;
  if (!path) return;
  if (S && S.tick > 0 && !confirm("切换模块会重开一局，当前进度不保存。继续？")) {
    loadModules();
    return;
  }
  try {
    const r = await fetch("/api/module", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const j = await r.json();
    if (j.error) { toast(j.error); return; }
    S = j;
    GEO = null;          // 省界跟着模块走
    if (BASEMAP) BASEMAP = null;
    await loadGeo();
    if (!BASEMAP) loadBasemap();
    selUnit = null; curProv = null; nodeProv = null;
    document.getElementById("outcome").classList.remove("on");
    render();
    toast("已切换到 " + path.split("/").pop());
  } catch (e) { toast("切换失败：连不上服务"); }
});

async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  try {
    const r = await fetch(path, opt);
    const j = await r.json();
    if (j.error) toast(j.error);
    S = j.state || j;
    if (selUnit !== null && !allUnits().find((u) => u.index === selUnit)) { selUnit = null; curProv = null; }
    render();
    showOutcome();
    refreshLlm();
    refreshReports();
    refreshTelegrams();
  } catch (e) { toast("连接失败，检查服务是否运行"); }
}

// 电报台：玩家唯一的指挥入口。
// 地图只用来查看——不发命令、不调兵。命令一律变成文字，交给将领去理解。
//
// 收件人可以细到**任何一个军/师**，不必只发给兵团：
// 史实里战区长官越级调 74 军这种事很常见，而且兵团只有三个，
// 18 个师里有 12 个根本无从下令——那不是"指挥"，那是被架空了。
function renderDispatch() {
  const sel = $("dp-to");
  if (!sel || !S) return;
  const units = [];
  for (const p of S.provinces) {
    for (const u of p.units || []) if (u.mine) units.push(u);
  }
  // 兵团 → 下属部队；没有上级番号的归"直属"
  const groups = new Map();
  for (const u of units) {
    const f = u.formation || "直属";
    if (!groups.has(f)) groups.set(f, []);
    groups.get(f).push(u);
  }
  const keep = sel.value;
  sel.innerHTML = "";
  const opt = (val, text) => {
    const o = document.createElement("option");
    o.value = val;
    o.textContent = text;
    return o;
  };
  const marching = (u) => (u.march_hops > 0 && u.march_to ? "　→" + u.march_to + " " + u.march_hops + "日" : "");
  for (const [f, list] of groups) {
    const g = document.createElement("optgroup");
    g.label = f + " · " + list.length + " 部";
    if (f !== "直属") g.appendChild(opt(f, "【整个】" + f));
    for (const u of list) {
      g.appendChild(opt(u.name, u.name + "　" + u.strength.toFixed(1) + " 千" + marching(u)));
    }
    sel.appendChild(g);
  }
  const g = document.createElement("optgroup");
  g.label = "战区";
  g.appendChild(opt("全体", "全体部队（" + units.length + " 部）"));
  sel.appendChild(g);
  if (keep && [...sel.options].some((o) => o.value === keep)) sel.value = keep;
}

async function refreshTelegrams() {
  const box = $("dp-list");
  if (!box) return;
  let list = [];
  try {
    const j = await (await fetch("/api/telegrams")).json();
    list = j.telegrams || [];
  } catch (e) { return; }
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = "<div class='tg' style='cursor:default'>还没有发过电报。</div>";
    return;
  }
  for (const t of list.slice(0, 4)) {
    const d = document.createElement("div");
    d.className = "tg" + (t.status === "enroute" ? " enroute" : "");
    const h = document.createElement("div");
    h.className = "tg-h";
    h.innerHTML = "<span>→ " + t.to + "</span><span>" +
      (t.status === "enroute" ? "第" + t.arrive_day + "日送达" : "已送达") + "</span>";
    const b = document.createElement("div");
    b.textContent = t.text;
    d.appendChild(h);
    d.appendChild(b);
    if (t.reply) {
      const rp = document.createElement("div");
      rp.style.color = "#93a2b3";
      rp.textContent = "回电：" + t.reply;
      d.appendChild(rp);
    }
    box.appendChild(d);
  }
}

async function sendTelegram() {
  const to = $("dp-to").value;
  const text = $("dp-text").value.trim();
  if (!text) { toast("电报内容不能为空"); return; }
  try {
    const r = await fetch("/api/dispatch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: to, text: text }),
    });
    const j = await r.json();
    if (!j.ok) { toast(j.error || "发送失败"); return; }
    $("dp-text").value = "";
    toast("电报已发出，第 " + j.arrive_day + " 日送达 " + to);
    refreshTelegrams();
  } catch (e) { toast("发送失败：连不上服务"); }
}
// ---- 战报信箱 ----
// 之前所有战报挤在右下角一个 200px 高的小窗口里，长句被截断、也分不清是哪一仗。
// 现在：侧栏只显示最新一条，点「打开战报信箱」进入全屏列表，一封一封看。
const KIND_CN = { combat: "战斗", occupy: "易手", dissent: "抗命", cmd: "将领", rule: "规则", intel: "情报", supply: "后勤", retreat: "撤退", oob: "编制" };
// 默认只看"重要"：规则类（山地行军减员）每 tick 每个单位一条，会把真正的战况埋掉
const MAIL_KEY = ["combat", "occupy", "dissent", "cmd", "oob"];
let mailFilter = "key";
let mailSel = 0;

function mailItems() {
  const all = (S && S.log) || [];
  if (mailFilter === "all") return all;
  if (mailFilter === "key") return all.filter((e) => MAIL_KEY.includes(e.kind));
  return all.filter((e) => e.kind === mailFilter);
}

function openMail() {
  const m = $("mail");
  if (!m) return;
  m.classList.add("show");
  renderMail();
}

function closeMail() {
  const m = $("mail");
  if (m) m.classList.remove("show");
}

function renderMail() {
  const list = $("mail-list"), detail = $("mail-detail"), chips = $("mail-chips");
  if (!list) return;
  const items = mailItems();
  $("mail-count").textContent = "共 " + items.length + " 条";

  // 分类筛选
  const kinds = ["key", "all", "combat", "occupy", "oob", "dissent", "cmd", "rule"];
  chips.innerHTML = "";
  for (const k of kinds) {
    const b = document.createElement("button");
    b.className = "m-chip" + (mailFilter === k ? " on" : "");
    b.textContent = k === "key" ? "重要" : (k === "all" ? "全部" : (KIND_CN[k] || k));
    b.onclick = () => { mailFilter = k; mailSel = 0; renderMail(); };
    chips.appendChild(b);
  }

  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = "<div class='m-item'>没有这一类战报</div>";
    detail.textContent = "";
    return;
  }
  if (mailSel >= items.length) mailSel = 0;

  items.forEach((e, i) => {
    const d = document.createElement("div");
    d.className = "m-item" + (i === mailSel ? " on" : "");
    const meta = document.createElement("div");
    meta.className = "m-meta";
    meta.textContent = "第 " + e.tick + " 日 · " + (KIND_CN[e.kind] || e.kind);
    const t = document.createElement("div");
    t.textContent = e.text.length > 34 ? e.text.slice(0, 34) + "…" : e.text;
    d.appendChild(meta);
    d.appendChild(t);
    d.onclick = () => { mailSel = i; renderMail(); };
    list.appendChild(d);
  });

  // 右侧全文，大字行距宽，能一眼读完
  const cur = items[mailSel];
  detail.innerHTML = "";
  const title = document.createElement("div");
  title.className = "m-title";
  title.textContent = "第 " + cur.tick + " 日 · " + (KIND_CN[cur.kind] || cur.kind);
  const body = document.createElement("div");
  body.textContent = cur.text;
  detail.appendChild(title);
  detail.appendChild(body);
}

// 侧栏只放最新一条，点一下就能开信箱
function renderLatestLog() {
  const box = $("log-latest");
  if (!box || !S) return;
  const items = S.log || [];
  if (!items.length) {
    box.innerHTML = "<span class='lg-kind'>暂无战报</span>";
    return;
  }
  const e = items[0];
  box.innerHTML = "<span class='lg-kind'>第 " + e.tick + " 日 · " +
    (KIND_CN[e.kind] || e.kind) + "</span><br>" +
    (e.text.length > 46 ? e.text.slice(0, 46) + "…" : e.text);
}
// 公文堆：请示要人做决定，抗命要追认，通报只读。
// 数据来自 /api/reports，跟 /api/state 分开取，免得每点一下都把公文重传一遍。
async function refreshReports() {
  const box = $("dossiers");
  if (!box) return;
  let list = [];
  try {
    const j = await (await fetch("/api/reports")).json();
    list = j.reports || [];
  } catch (e) { return; }

  const pending = list.filter((r) => r.status === "pending");
  $("dossier-count").textContent = pending.length ? "· " + pending.length + " 待批" : "";
  // 顶部红点：HOI4 那套"屏幕上方警示"，不要让人翻栏找
  const badge = $("pending");
  if (badge) {
    badge.textContent = pending.length ? "请示 " + pending.length + " 份待批" : "战报已清";
    badge.classList.toggle("hot", pending.length > 0);
  }

  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = "<div class='ol' style='cursor:default;color:#6f7a86'>暂无公文。将领有异议时会先来请示。</div>";
    return;
  }
  // 只显示最要紧的 4 条：请示优先，其余折叠成一行，否则右栏会被公文吃光
  const shown = list.filter((r) => r.status === "pending").concat(list.filter((r) => r.status !== "pending")).slice(0, 4);
  const rest = list.length - shown.length;
  for (const r of shown) {
    const d = document.createElement("div");
    d.className = "dossier " + r.kind + (r.status === "pending" ? "" : " done");
    const head = document.createElement("div");
    head.className = "d-head";
    head.innerHTML = "<span class='d-from'>" + r.unit_name + "·" + r.general + "</span>" +
      "<span>第" + r.day + "日" + (r.status === "pending" ? "　截止第" + r.deadline + "日"
        : "　" + ({ approved: "已准", denied: "已驳回", expired: "逾期自决" }[r.status] || r.status)) + "</span>";
    const body = document.createElement("div");
    body.className = "d-body";
    body.textContent = r.text.length > 110 ? r.text.slice(0, 110) + "……" : r.text;
    body.title = r.text;
    d.appendChild(head);
    d.appendChild(body);
    if (r.kind === "request" && r.status === "pending") {
      const ask = document.createElement("div");
      ask.className = "d-ask";
      ask.textContent = "请示：" + r.title + "　准不准？";
      d.appendChild(ask);
      const acts = document.createElement("div");
      acts.className = "d-act";
      const yes = document.createElement("button");
      yes.className = "yes";
      yes.textContent = "准他改令";
      yes.onclick = (ev) => { ev.stopPropagation(); answerReport(r.id, "yes"); };
      const no = document.createElement("button");
      no.className = "no";
      no.textContent = "驳回";
      no.onclick = (ev) => { ev.stopPropagation(); answerReport(r.id, "no"); };
      acts.appendChild(yes);
      acts.appendChild(no);
      d.appendChild(acts);
    }
    box.appendChild(d);
  }
  if (rest > 0) {
    const more = document.createElement("div");
    more.className = "ol";
    more.style.cursor = "default";
    more.textContent = "另有 " + rest + " 条已处理公文";
    box.appendChild(more);
  }
}

async function answerReport(id, choice) {
  try {
    const r = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, choice: choice }),
    });
    const j = await r.json();
    if (j.msg) toast(j.msg);
    if (j.state) S = j.state;
    render();
    refreshReports();
  } catch (e) { toast("批复失败：连不上服务"); }
}

// 部队列表：HOI4 的 outliner。不用在图上点，直接从列表挑部队。
function renderOutliner() {
  const box = $("outliner");
  if (!box || !S) return;
  const mine = allUnits().filter((u) => u.mine && u.kind_code !== 2 && u.kind_code !== 3);
  $("outliner-count").textContent = mine.length ? "· " + mine.length + " 支" : "";
  box.innerHTML = "";
  if (!mine.length) {
    box.innerHTML = "<div class='ol' style='cursor:default;color:#6f7a86'>无可用部队</div>";
    return;
  }
  // 按所在省排，让同一战线的部队挨着
  const rows = mine.map((u) => {
    const p = S.provinces.find((q) => (q.units || []).some((x) => x.index === u.index));
    return { u, p };
  }).sort((a, b) => (a.p && b.p ? a.p.name.localeCompare(b.p.name) : 0));

  for (const { u, p } of rows) {
    const d = document.createElement("div");
    d.className = "ol" + (selUnit === u.index ? " sel" : "");
    const left = document.createElement("span");
    left.textContent = u.name + "　" + (p ? p.name : "?") +
      (p && p.positions && p.positions[u.node] ? "·" + p.positions[u.node].name : "");
    const right = document.createElement("span");
    right.className = "ol-r";
    // 行军中的部队要能一眼看出来：第几天到、去哪。
    // 没有这一项，远距离调动在地图上就是"部队忽然不见了几天"。
    const marching = u.march_hops > 0 && u.march_to;
    // 断粮比行军更要紧：补给见底不只打不动，还会每天死人（见 docs/20）。
    const hungry = u.encircled ? "被围·" : (u.supply < 0.15 ? "断粮·" : (u.supply < 0.3 ? "缺粮·" : ""));
    right.textContent = hungry + u.strength.toFixed(1) + " 千 " +
      (marching ? "→" + u.march_to + " " + u.march_hops + "日" : u.order);
    if (hungry) right.style.color = "#d9534f";
    else if (marching) right.style.color = "#c9a227";
    d.appendChild(left);
    d.appendChild(right);
    d.title = u.commander + (u.disobeyed ? "（抗命中）" : "");
    d.onclick = (ev) => {
      ev.stopPropagation();
      selUnit = u.index;
      curProv = p ? p.id : null;
      nodeProv = null;
      render();
    };
    box.appendChild(d);
  }

  // 编制簿：已经覆灭的番号。
  // 番号没了、军长殉国、还有多少天重建——这就是"编制改变"的全部内容，
  // 不摆出来，玩家只会以为部队"莫名其妙消失了"。
  const gone = S.gone || [];
  if (gone.length) {
    const sep = document.createElement("div");
    sep.className = "ol";
    sep.style.cursor = "default";
    sep.style.color = "#6f7a86";
    sep.textContent = "— 已覆灭 —";
    box.appendChild(sep);
    for (const g of gone) {
      const d = document.createElement("div");
      d.className = "ol";
      d.style.opacity = "0.6";
      const left = document.createElement("span");
      left.textContent = g.name + "　" + (g.province || "?") + "　" + g.fate;
      const right = document.createElement("span");
      right.className = "ol-r";
      right.textContent = g.reform_day ? "第" + g.reform_day + "日整编" : "番号撤销";
      d.appendChild(left);
      d.appendChild(right);
      d.title = g.commander + "·" + g.fate +
        (g.reform_day ? "（整编后约 " + Math.round(g.reform_ratio * 100) + "% 兵力）" : "");
      box.appendChild(d);
    }
  }
}

function showTip(ev, p) {
  const t = $("tip");
  const rows = ["<div class='t-name'>" + p.name + "</div>"];
  rows.push("<div class='t-row'>地形：<b>" + (TERRAIN_CN[p.terrain] || p.terrain) + "</b>" +
    (p.elev != null ? "<span style='color:#7d8794'>　海拔 " + p.elev + " 米 · 高差 " + p.relief + " 米</span>" : "") +
    (p.fort ? "　工事：<b>" + p.fort + "</b>" : "") + "</div>");
  // 舰炮支援：舰队唯一"看得见"的作用。不显示的话，玩家只会觉得它是摆设。
  if (p.naval_bonus && p.naval_bonus > 1.005) {
    rows.push("<div class='t-row'>舰炮支援：<b>×" + p.naval_bonus.toFixed(2) + "</b>" +
      "<span style='color:#7d8794'>　江面舰船压制</span></div>");
  }
  // 敌方的舰炮支援：这才是玩家真正要看到的——"九江为什么守不住"
  if (p.naval_bonus_enemy && p.naval_bonus_enemy > 1.005) {
    rows.push("<div class='t-row'>敌舰炮支援：<b>×" + p.naval_bonus_enemy.toFixed(2) + "</b>" +
      "<span style='color:#7d8794'>　江面被封锁</span></div>");
  }
  rows.push("<div class='t-row'>归属：<b>" + (p.mine ? "我方" : (p.owner_known ? "敌方" : "未知")) + "</b></div>");
  if (p.supply_source) rows.push("<div class='t-row'>补给源</div>");
  // 阵地：多阵地省把每个阵地的宽度与工事列出来，
  // 玩家才能判断"这个山头放不放得下我一个军"。
  if (p.positions && p.positions.length > 1) {
    rows.push("<div class='t-row'>阵地：" + p.positions
      .map((x, i) => "<b>" + x.name + "</b>(" + Math.round(x.width * 100) + "%" +
        (x.fort ? "·砦" + x.fort : "") + ")")
      .join("　") + "</div>");
  }
  if (p.intel.known && !p.mine) {
    rows.push("<div class='t-row'>敌情：<b>" + p.intel.accuracy + "</b>　约 <b>" + p.intel.strength.toFixed(1) + "</b> 千</div>");
  }
  for (const u of p.units || []) {
    rows.push("<div class='t-row'>" + (u.mine ? "我" : "敌") + "：<b>" + u.name + "</b> " +
      u.strength.toFixed(1) + " 千" + (u.disobeyed ? " ⚠" : "") + "</div>");
    // 人物志：只给我方单位显示，否则悬停卡片会长得看不下去
    if (u.mine && u.commander_persona) {
      rows.push("<div class='t-row' style='color:#8b95a1;line-height:1.5'>" +
        u.commander_title + "：" + u.commander_persona + "</div>");
    }
  }
  t.innerHTML = rows.join("");
  t.style.display = "block";
  moveTip(ev);
}
function moveTip(ev) {
  const t = $("tip"), rect = $("stage").getBoundingClientRect();
  let x = ev.clientX - rect.left + 16, y = ev.clientY - rect.top + 12;
  if (x + 230 > rect.width) x -= 250;
  if (y + 150 > rect.height) y -= 160;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip() { $("tip").style.display = "none"; }

function onProvince(p) {
  if (suppressClick) return; // 刚拖过地图，这一下不算点击
  // 地图只用来查看。任何命令都必须变成文字发给将领，由他决定怎么做。
  const hasMine = (p.units || []).some((u) => u.mine);
  toast(hasMine
    ? p.name + "：要看部队点单位标记；要指挥请写电报"
    : p.name + "：地图只作查看，指挥走右侧电报台");
}
function onProvinceDisabled(p) {
  const cp = S.provinces.find((x) => x.id === curProv);
  if (!cp) return;
  if (p.id === curProv) {
    api("/api/order", { unit: selUnit, kind: "hold" });
    toast("已下令固守 " + p.name);
    return;
  }
  if (cp.neighbors.indexOf(p.id) < 0) { toast("只能对相邻省份下令"); return; }
  const e = lastEv || {};
  // 目标归属决定命令类别：自己的省只能移防，敌方空省是推进，敌方有兵才是进攻。
  // 服务端会做同样的校正，这里只是让提示文字说实话。
  const enemyHere = (p.units || []).some((u) => !u.mine);
  let kind = e.altKey ? "retreat" : "attack";
  if (e.shiftKey) kind = "move";
  if (kind === "attack" && (p.mine || !enemyHere)) kind = "move";
  const verb = kind === "retreat" ? "撤退" : (p.mine ? "增援" : (enemyHere ? "进攻" : "推进"));
  api("/api/order", { unit: selUnit, kind: kind, target: p.id });
  toast("已下令：" + verb + " " + p.name);
}

// ---- 相机操作：滚轮缩放、拖拽平移、双击复位 ----
// 拖拽超过 5px 就吃掉随后的 click，否则"拖一下地图"会顺手给一个省下令。
let dragging = false;
let dragMoved = false;
let dragFrom = null;
let suppressClick = false;

(function wireCamera() {
  const stage = $("stage");

  stage.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const rect = $("map").getBoundingClientRect();
    const v = camView();
    // 光标在世界坐标里的位置，缩放前后保持不动
    const fx = (ev.clientX - rect.left) / rect.width;
    const fy = (ev.clientY - rect.top) / rect.height;
    const wx = v.x + fx * v.w;
    const wy = v.y + fy * v.h;
    const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
    const nz = Math.min(CAM_MAX, Math.max(1, cam.z * factor));
    if (nz === cam.z) return;
    cam.z = nz;
    const nv = camView();
    cam.x = wx - fx * nv.w;
    cam.y = wy - fy * nv.h;
    clampCam();
    applyCam();
  }, { passive: false });

  stage.addEventListener("mousedown", (ev) => {
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = false;
    dragFrom = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y };
  });

  window.addEventListener("mousemove", (ev) => {
    if (!dragging) return;
    const dx = ev.clientX - dragFrom.x;
    const dy = ev.clientY - dragFrom.y;
    if (!dragMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    dragMoved = true;
    const rect = $("map").getBoundingClientRect();
    const k = camView().w / rect.width;
    cam.x = dragFrom.cx - dx * k;
    cam.y = dragFrom.cy - dy * k;
    clampCam();
    applyCam();
    $("stage").style.cursor = "grabbing";
  });

  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    suppressClick = dragMoved;
    dragMoved = false;
    $("stage").style.cursor = "";
    // 下一帧再解除，让这次的 click 被吃掉
    setTimeout(() => { suppressClick = false; }, 0);
  });

  // 双击 = 复位视角
  stage.addEventListener("dblclick", (ev) => {
    if (ev.target.closest(".unit")) return;
    cam = { x: 0, y: 0, z: 1 };
    applyCam();
    toast("视角复位");
  });
})();

// 存档 / 读档。
// 存的是命令流而不是世界快照：读档时服务端用 (模块, 种子, 命令流) 重跑一遍，
// 并核对哈希——对得上才说明这一局可复现（见 docs/11）。
// 存档：可以起名字（槽位）。名字只留字母数字与 - _，由服务端再消毒一次。
bind("btn-save", "click", async () => {
  const slot = prompt("存档名（留空 = 按时间戳）", "第" + ((S && S.tick) || 0) + "日");
  if (slot === null) return;
  try {
    const r = await fetch("/api/save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slot: slot || undefined }),
    });
    const j = await r.json();
    toast(j.ok ? "已存档 " + (j.path || "") + "（第 " + j.day + " 日，" + j.commands + " 条命令）" : (j.error || "存档失败"));
  } catch (e) { toast("存档失败：连不上服务"); }
});
// 读档：先列槽位，选一个读。空输入 = 读最新的一份。
bind("btn-load", "click", async () => {
  let slot = null;
  try {
    const j = await (await fetch("/api/saves")).json();
    const list = j.saves || [];
    if (list.length) {
      const menu = list.map((s, i) =>
        (i + 1) + ". " + s.slot + "　第" + s.day + "日 · " + s.commands + " 条命令").join("\n");
      const pick = prompt("读哪一份？（输入序号，留空 = 最新）\n\n" + menu, "");
      if (pick === null) return;
      const idx = parseInt(pick, 10);
      if (!isNaN(idx) && list[idx - 1]) slot = list[idx - 1].slot;
    }
  } catch (e) { /* 列不出来就直接读最新的 */ }
  try {
    const r = await fetch("/api/load", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slot: slot || undefined }),
    });
    const j = await r.json();
    if (!j.ok) { toast(j.error || "读档失败"); return; }
    S = j.state;
    selUnit = null; curProv = null; nodeProv = null; geom = null;
    render();
    toast("读档到第 " + j.day + " 日" + (j.hash_matched ? "（哈希一致）" : "，⚠ 哈希不一致"));
  } catch (e) { toast("读档失败：连不上服务"); }
});
bind("btn-reset", "click", () => {
  selUnit = null; curProv = null; geom = null;
  api("/api/reset", {}).then(() => toast("已重开"));
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); api("/api/tick", { days: 1 }); }
  if (e.code === "Enter") { e.preventDefault(); api("/api/advance", {}); }
  if (e.code === "Escape") {
    selUnit = null; curProv = null;
    $("hint").textContent = "地图只作查看：点单位看详情；下命令请用右侧电报台";
    render();
  }
});

// 启动：拿不到状态就每 2 秒重试。服务重启/刷新时序不对时，
// 之前会永远停在一块空白界面上，看起来像坏了。
async function boot() {
  await api("/api/state");
  loadModules();
  if (!BASEMAP) loadBasemap();
  if (!GEO) loadGeo();
  if (!S) setTimeout(boot, 2000);
}
boot();
