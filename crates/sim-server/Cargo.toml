[package]
name = "sim-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "钢心 / Iron Mind —— 本地服务与 HTTP 接口（桌面外壳与安卓外壳共用）"

[lib]
name = "sim_server"
path = "src/lib.rs"

[dependencies]
sim-core = { path = "../sim-core" }
sim-content = { path = "../sim-content" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sim-server"
path = "src/main.rs"
