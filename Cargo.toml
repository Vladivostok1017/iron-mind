[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-content",
    "crates/sim-testbed",
    "crates/sim-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"



