[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-content",
    "crates/sim-testbed",
    "crates/sim-server",
    "crates/sim-desktop",
    "crates/sim-mobile",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"



